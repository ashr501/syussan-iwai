<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="title"><title id="title">贈る前の3つの確認</title><rect width="600" height="780" fill="#faf8f3"/><g font-family="Hiragino Sans, Noto Sans JP, sans-serif" fill="#293e37"><text x="26" y="60" font-size="32" font-weight="700">贈る前の3つの確認</text><text x="26" y="105" font-size="28">編集上の確認リスト</text><rect x="26" y="140" width="548" height="140" rx="14" fill="#e9efea"/><text x="45" y="190" font-size="34" font-weight="700">重複</text><text x="45" y="240" font-size="28">すでに持っている？</text><rect x="26" y="305" width="548" height="140" rx="14" fill="#e9efea"/><text x="45" y="355" font-size="34" font-weight="700">好み</text><text x="45" y="405" font-size="28">いつも使うものに合う？</text><rect x="26" y="470" width="548" height="140" rx="14" fill="#e9efea"/><text x="45" y="520" font-size="34" font-weight="700">置き場所</text><text x="45" y="570" font-size="28">収納や手間は増えない？</text><text x="26" y="695" font-size="28">家庭や商品によって変わります。</text><text x="26" y="735" font-size="28">本人の希望を確かめてから。</text></g></svg>